name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: CLI success scenario
        run: python -m kzp_lab06.cli data/input.csv reports/ci-summary.txt

      - name: Prepare invalid CSV
        run: python -c "from pathlib import Path; Path('reports/invalid-input.txt').write_text('meter,date,value,tariff\nMeter-1,2026-11-01,abc,4.32\n', encoding='utf-8')"

      - name: CLI error scenario
        run: python -c "import subprocess, sys; result = subprocess.run([sys.executable, '-m', 'kzp_lab06.cli', 'reports/invalid-input.txt', 'reports/invalid-summary.txt'], check=False); print('Exit code:', result.returncode); assert result.returncode == 2"

      - name: Build wheel
        run: python -m build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kzp-utility-report-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error