name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Check application version
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: java -jar target/lab01-1.0.0.jar --version

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/lab01-1.0.0.jar
          if-no-files-found: error