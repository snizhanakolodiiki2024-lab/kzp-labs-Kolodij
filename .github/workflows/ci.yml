```yaml
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Detect JAR name on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR_NAME="$(./mvnw help:evaluate -Dexpression=project.build.finalName -q -DforceStdout).jar"
          echo "JAR_NAME=$JAR_NAME" >> "$GITHUB_ENV"
          echo "Detected JAR: $JAR_NAME"

      - name: Detect JAR name on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jarName = .\mvnw.cmd help:evaluate "-Dexpression=project.build.finalName" -q -DforceStdout
          "JAR_NAME=$jarName.jar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Detected JAR: $jarName.jar"

      - name: Check application version
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: java -jar target/${{ env.JAR_NAME }} --version

      - name: Generate Lab5 CSV
        run: java -jar target/${{ env.JAR_NAME }} --export-csv out/lab5-readings.csv

      - name: Generate Lab5 JSON
        run: java -jar target/${{ env.JAR_NAME }} --export-json out/lab5-readings.json

      - name: Upload Lab5 artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: lab5-${{ matrix.os }}-${{ github.run_number }}
          path: |
            target/${{ env.JAR_NAME }}
            out/lab5-readings.csv
            out/lab5-readings.json
          if-no-files-found: error
```